name: uav

channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10
  - pip

  # ===== GUI (cài bằng Conda) =====
  - pyqt=5.15.*
  - pyqtwebengine
  - geographiclib
  - decorator
  - qt-main

  - pip:
      # ===== UAV =====
      - mavsdk==3.15.3
      - pymavlink==2.4.49
      - pyserial==3.5

      # ===== AI =====
      - torch
      - torchvision
      - torchaudio
      - ultralytics==8.4.37

      # Nếu không dùng cv2.imshow() thì giữ headless
      - opencv-python-headless==4.13.0.92
      # Nếu có dùng giao diện OpenCV thì thay bằng:
      # - opencv-python==4.13.0.92

      - imutils==0.5.4

      # ===== Map =====
      - folium==0.20.0
      - shapely==2.1.2

      # ===== Async =====
      - qasync==0.28.0
      - asyncqt==0.8.0

      # ===== Utils =====
      - pygame==2.6.1
      - pandas==2.3.3
      - tqdm==4.67.3
      - colorlog==6.10.1
      - pyfiglet==1.0.4
      - pyproj==3.7.1

      - pyyaml
      - numpy==2.2.6
      - scipy==1.15.3
      - sympy==1.14.0
      - psutil
      - jinja2
      - pytz
      - matplotlib==3.10.9